name: Windows candidate installer upgrade and manual rollback

on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: Published stable source installer tag
        required: true
        default: v0.0.2
        type: string
      candidate_tag:
        description: Stable candidate tag (draft Release is allowed)
        required: true
        default: v0.0.3
        type: string
      candidate_sha:
        description: Exact full commit SHA expected behind the candidate tag
        required: true
        default: c92d8da7c0d4c35280540734c8f69de7e61cf2d6
        type: string

permissions:
  contents: read

concurrency:
  group: windows-candidate-upgrade-${{ inputs.candidate_tag }}
  cancel-in-progress: false

jobs:
  isolated-installer-journey:
    if: ${{ github.repository == 'yuchen0x1/Novel-Writer-master' }}
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      # The candidate tag predates this harness; bind tested installers separately.
      - name: Check out current main acceptance harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install locked harness dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Exercise real installer upgrade and manual reinstall rollback
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.from_tag }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          & ./scripts/windows-candidate-upgrade.ps1 -FromTag $env:SOURCE_TAG -CandidateTag $env:CANDIDATE_TAG -CandidateSha $env:CANDIDATE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain scoped acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-candidate-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/ai-novel-candidate-upgrade-evidence/*.json
