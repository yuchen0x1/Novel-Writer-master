name: Verify public desktop release

on:
  release:
    types: [published]
  schedule:
    - cron: '26 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'release' || (github.event.release.draft == false && github.event.release.prerelease == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.20.0
      - name: Stream and verify all public assets of the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-public-desktop-release.mjs
