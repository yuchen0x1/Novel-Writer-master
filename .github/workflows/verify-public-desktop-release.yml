name: Verify public desktop release

on:
  release:
    types: [published]
  schedule:
    - cron: '26 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'release' || (github.event.release.draft == false && github.event.release.prerelease == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
      - name: Stream and verify all public assets of the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-public-desktop-release.mjs
