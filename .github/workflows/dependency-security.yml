name: Dependency security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '18 2 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          fail-on-scopes: runtime

  audit:
    name: Production dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.11.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.20.0
      - name: Audit desktop and plugin production dependencies
        run: |
          pnpm audit --prod --audit-level high --registry=https://registry.npmjs.org
          pnpm --dir plugins/dsh-ai-novel-writer audit --prod --audit-level high --registry=https://registry.npmjs.org
      - name: Report desktop development dependency advisories
        if: always()
        continue-on-error: true
        run: pnpm audit --dev --audit-level high --registry=https://registry.npmjs.org
